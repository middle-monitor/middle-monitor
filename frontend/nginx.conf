server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hide nginx version (info disclosure)
    server_tokens off;

    # ----- Security headers -----
    # HSTS only takes effect on HTTPS — safe to keep here, the reverse proxy in
    # front (Caddy/CDN) is what serves TLS. 1-year preload-eligible value.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Prevent clickjacking. Same-origin allows the dashboard to embed its own iframes if needed.
    add_header X-Frame-Options "SAMEORIGIN" always;
    # Disable MIME sniffing.
    add_header X-Content-Type-Options "nosniff" always;
    # Don't leak full URLs to third parties.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Deny all legacy permissions APIs we don't use.
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    # CSP tuned for this SPA: same-origin scripts/styles, the configured API base,
    # plus the Google Fonts assets the index.html preconnects to. Adjust connect-src
    # if you point the dashboard at a different API host.
    # ANALYTICS_ORIGIN is the optional Plausible instance injected at build time:
    # it needs script-src to load the tracker and connect-src to POST events.
    # 'wasm-unsafe-eval' is not needed by the app itself: it silences the Firefox
    # console warning raised when browser extensions instantiate wasm in the page.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' ${ANALYTICS_ORIGIN}; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' ${ANALYTICS_ORIGIN}; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Proxy API and agent download endpoints to the backend.
    # "api" is the docker-compose service name; 8080 is the container port.
    # Resolve through Docker's embedded DNS at request time (resolver +
    # variable), not at startup: a static proxy_pass makes nginx exit with
    # [emerg] "host not found in upstream" when this task starts while the
    # api service is mid-rollout, failing every stack deploy of the frontend.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # The API's own machine-readable description, served from the canonical
    # origin so a tool can find it without knowing the API hostname. Exact-match
    # locations win over the regex below.
    location = /openapi.json {
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream/api/v1/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # The JSON Schemas the docs link to. They live in the repositories that own
    # them (the payload with the API that sends it, the agent config with the
    # agent), so the API serves them and this origin proxies. "^~" wins over the
    # regex location below.
    location ^~ /schemas/ {
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://api:8080;
        # proxy_pass with a variable does no prefix substitution, so the path is
        # passed explicitly. Dropping $uri here would serve every schema request
        # the same file.
        proxy_pass $api_upstream/api/v1$uri$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # A path that names a file must answer 404 when the file is not there. With
    # the SPA fallback below, /llms.txt and /openapi.json answered 200 with the
    # HTML shell, so an automated client could not tell a missing document from
    # a present one: it parsed the shell and believed it had succeeded.
    location ~* \.(txt|md|json|xml|ya?ml|csv|map)$ {
        types {
            text/plain               txt;
            text/markdown            md;
            application/json         json;
            application/xml          xml;
            application/yaml         yaml yml;
            text/csv                 csv;
        }
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        # $uri/index.html (naming the file directly) serves the prerendered page
        # for /pricing and /docs without nginx's trailing-slash 301, which would
        # drop the host port mapped by docker-compose. Anything else falls back
        # to the SPA shell.
        try_files $uri $uri/index.html /index.html;
    }

    # Browser caching for static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # Re-emit security headers for asset responses (add_header doesn't inherit
        # across location blocks).
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
